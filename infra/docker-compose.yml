services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      args:
        TORCH_BUILD_TYPE: ${TORCH_BUILD_TYPE:-cpu}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Mount the dataset directory directly (bypasses symlinks).
      # Set CIC_IDS2017_DIR in .env to point at the host archive copy.
      # Default falls back to ./data/CIC-IDS2017 for the bundled/downloaded copy.
      - ${CIC_IDS2017_DIR:-./data/CIC-IDS2017}:/app/data/CIC-IDS2017:ro
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
      - path: .env.demo
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  ui:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ui
    ports:
      - "5173:5173"
    environment:
      - API_TARGET=http://api:8000
    depends_on:
      api:
        condition: service_healthy
